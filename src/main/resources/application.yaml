spring:
  config:
    import: "optional:file:${APP_ENV_FILE:.env}[extension=.properties][encoding=utf-8]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
    default: dev
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE}
  application:
    name: ${SPRING_APPLICATION_NAME}
  datasource:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    open-in-view: ${JPA_OPEN_IN_VIEW}
  batch:
    job:
      enabled: ${BATCH_JOB_ENABLED}
    jdbc:
      initialize-schema: ${BATCH_SCHEMA_INITIALIZATION}
  session:
    store-type: ${SESSION_STORE_TYPE}
  data:
    redis:
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
      timeout: ${REDIS_TIMEOUT}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT}
      ssl:
        enabled: ${REDIS_SSL_ENABLED}
      repositories:
        enabled: ${REDIS_REPOSITORIES_ENABLED}
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS}
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT}
      mail.smtp.timeout: ${MAIL_TIMEOUT}
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:ollama}
      embedding: ${AI_EMBEDDING_PROVIDER:ollama}
      audio:
        speech: ${AI_SPEECH_PROVIDER}
        transcription: ${AI_TRANSCRIPTION_PROVIDER}
      image: ${AI_IMAGE_PROVIDER}
      moderation: ${AI_MODERATION_PROVIDER}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        model: ${AI_CHAT_MODEL:qwen2.5:7b}
        temperature: ${AI_CHAT_TEMPERATURE:0.2}
        num-predict: ${AI_MAX_OUTPUT_TOKENS:2000}
        num-ctx: ${OLLAMA_CONTEXT_LENGTH:8192}
        keep-alive: ${OLLAMA_KEEP_ALIVE:5m}
      embedding:
        model: ${AI_EMBEDDING_MODEL:qwen3-embedding:0.6b}
        keep-alive: ${OLLAMA_KEEP_ALIVE:5m}
        truncate: false
    vectorstore:
      qdrant:
        enabled: ${QDRANT_VECTORSTORE_ENABLED}
  autoconfigure:
    exclude: ${SPRING_AUTOCONFIGURE_EXCLUDE}
server:
  port: ${SERVER_PORT}
app:
  jobs:
    salary-exchange:
      enabled: ${SALARY_EXCHANGE_ENABLED:true}
      url: ${SALARY_EXCHANGE_URL:https://open.er-api.com/v6/latest/USD}
    collection:
      enabled: ${JOB_COLLECTION_ENABLED}
      actor-id: ${JOB_COLLECTION_ACTOR_ID}
      fixed-delay: ${JOB_COLLECTION_FIXED_DELAY}
      sources:
        - source-site: ${JOB_COLLECTION_ITVIEC_SOURCE_SITE}
          keyword: ${JOB_COLLECTION_ITVIEC_KEYWORD}
          role-category: ${JOB_COLLECTION_ITVIEC_ROLE}
          location: ${JOB_COLLECTION_ITVIEC_LOCATION}
          limit: ${JOB_COLLECTION_LIMIT}
          max-pages: ${JOB_COLLECTION_MAX_PAGES}
        - source-site: ${JOB_COLLECTION_TOPCV_SOURCE_SITE}
          keyword: ${JOB_COLLECTION_TOPCV_KEYWORD}
          role-category: ${JOB_COLLECTION_TOPCV_ROLE}
          location: ${JOB_COLLECTION_TOPCV_LOCATION}
          limit: ${JOB_COLLECTION_LIMIT}
          max-pages: ${JOB_COLLECTION_MAX_PAGES}
    expiration:
      enabled: ${JOB_EXPIRATION_ENABLED}
      fixed-delay: ${JOB_EXPIRATION_FIXED_DELAY}
      batch-size: ${JOB_EXPIRATION_BATCH_SIZE}
    embedding:
      enabled: ${JOB_EMBEDDING_ENABLED}
      batch-size: ${JOB_EMBEDDING_BATCH_SIZE}
      fixed-delay-ms: ${JOB_EMBEDDING_FIXED_DELAY_MS}
      initial-delay-ms: ${JOB_EMBEDDING_INITIAL_DELAY_MS}
      lease-seconds: ${JOB_EMBEDDING_LEASE_SECONDS}
      retry-seconds: ${JOB_EMBEDDING_RETRY_SECONDS}
  ai:
    enabled: ${AI_ENABLED}
    provider: ${AI_PROVIDER:ollama}
    embedding-dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
    embedding-context-length: ${OLLAMA_EMBEDDING_CONTEXT_LENGTH:8192}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS}
    assessment-max-output-tokens: ${AI_ASSESSMENT_MAX_OUTPUT_TOKENS:12000}
    assessment-context-length: ${AI_ASSESSMENT_CONTEXT_LENGTH:16384}
    assessment-model: ${AI_ASSESSMENT_MODEL:qwen3.5:4b}
    assessment-think: ${AI_ASSESSMENT_THINK:true}
    request-timeout: ${AI_REQUEST_TIMEOUT:PT15M}
    learning-max-output-tokens: ${AI_LEARNING_MAX_OUTPUT_TOKENS:4000}
  ocr:
    enabled: ${APP_OCR_ENABLED}
    tessdata: ${APP_OCR_TESSDATA}
    language: ${APP_OCR_LANGUAGE}
  mail:
    enabled: ${MAIL_ENABLED}
    from: ${MAIL_FROM}
  auth:
    mail-from: ${MAIL_FROM}
    google-client-id: ${GOOGLE_CLIENT_ID}
  guest:
    token-limit: ${GUEST_TOKEN_LIMIT}
  payment:
    sepay:
      enabled: ${SEPAY_ENABLED:false}
      environment: ${SEPAY_ENVIRONMENT:sandbox}
      merchant-id: ${SEPAY_MERCHANT_ID:}
      merchant-secret: ${SEPAY_MERCHANT_SECRET:}
      ipn-secret: ${SEPAY_IPN_SECRET:}
      return-url: ${SEPAY_RETURN_URL:}
      payment-method: ${SEPAY_PAYMENT_METHOD:BANK_TRANSFER}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
    provider: ${PAYMENT_PROVIDER}
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    jwt-secret: ${APP_JWT_SECRET}
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      full-name: ${BOOTSTRAP_ADMIN_NAME:Administrator}
    consultant:
      email: ${BOOTSTRAP_CONSULTANT_EMAIL:}
      password: ${BOOTSTRAP_CONSULTANT_PASSWORD:}
      full-name: ${BOOTSTRAP_CONSULTANT_NAME:Career Consultant}
  billing:
    maintenance-enabled: ${BILLING_MAINTENANCE_ENABLED}
    maintenance-batch-size: ${BILLING_MAINTENANCE_BATCH_SIZE}
    maintenance-zone: ${BILLING_MAINTENANCE_ZONE}
