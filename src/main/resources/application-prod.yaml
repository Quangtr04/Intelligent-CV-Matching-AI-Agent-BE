# Deployment services are configured explicitly; no localhost connection fallback.
spring:
  datasource:
    url: ${DATABASE_URL}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  docker:
    compose:
      enabled: false
  devtools:
    add-properties: false
    restart:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE:health,info}
  endpoint:
    health:
      show-details: never
      probes:
        enabled: ${HEALTH_PROBES_ENABLED:true}
  health:
    redis:
      enabled: ${HEALTH_REDIS_ENABLED:false}
    rabbit:
      enabled: ${HEALTH_RABBIT_ENABLED:false}
    mail:
      enabled: ${HEALTH_MAIL_ENABLED:false}

server:
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    web: ${LOG_WEB_LEVEL:INFO}
    sql: ${LOG_SQL_LEVEL:INFO}
    org.springframework.web: ${LOG_SPRING_WEB_LEVEL:INFO}
    org.springframework.jdbc: ${LOG_SPRING_JDBC_LEVEL:INFO}

app:
  storage:
    path: ${UPLOAD_DIR:./uploads}
  auth:
    expose-development-code: false
