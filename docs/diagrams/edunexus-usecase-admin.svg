<text x="1406" y="1390.6" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Thông báo nằm trong ứng dụng.</text>
<text x="1406" y="1411.4" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Giải quyết payment report chưa tự refund.</text>
