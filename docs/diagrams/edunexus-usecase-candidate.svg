<text x="135" y="1153" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#29465f">Ứng viên</text>
<rect x="1270.387" y="1450.6" width="79.227" height="28.8" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1310" y="1470.6" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#40526b">«include»</text>
<rect x="1271.918" y="1680.6" width="76.164" height="28.8" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1310" y="1700.6" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#40526b">«extend»</text>
<rect x="1390" y="310" width="600" height="300" rx="6" fill="#F8FAFC" stroke="#d5dfeb" stroke-width="1"/>
<text x="1406" y="403.2" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Điều kiện sử dụng:</text>
<text x="1406" y="424" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">• Phân tích CV / ATS: CV của người dùng, READY.</text>
<text x="1406" y="444.8" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">• Matching: career profile hoặc CV READY.</text>
<text x="1406" y="465.6" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">• ATS / draft theo job: việc làm ACTIVE.</text>
<text x="1406" y="486.4" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">• Assessment chọn cho roadmap: đã completed.</text>
<text x="1406" y="507.2" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">• Tài nguyên học lấy từ catalog.</text>
<text x="1406" y="528" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Các điều kiện này không phải «include».</text>
<rect x="1390" y="800" width="600" height="240" rx="6" fill="#F8FAFC" stroke="#d5dfeb" stroke-width="1"/>
<text x="1406" y="873.6" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Tạo bài, nộp bài và sinh roadmap</text>
<text x="1406" y="894.4" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">là các thao tác API độc lập.</text>
<text x="1406" y="915.2" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Nộp lần đầu chấm điểm; nộp lại trả kết quả đã lưu.</text>
<text x="1406" y="936" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b"></text>
<text x="1406" y="956.8" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Email / cover letter chỉ là draft.</text>
<text x="1406" y="977.6" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Ứng tuyển trả URL, không tự gửi đơn.</text>
<rect x="1390" y="1800" width="600" height="175" rx="6" fill="#F8FAFC" stroke="#d5dfeb" stroke-width="1"/>
<text x="1406" y="1861.9" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">RAG mở rộng chat khi retrieve=true</text>
<text x="1406" y="1882.7" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">và người dùng đã đăng nhập.</text>
<text x="1406" y="1903.5" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Guest không truy xuất tài liệu RAG.</text>
<text x="1406" y="1924.3" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Cần chat + embedding được cấu hình.</text>
<rect x="340" y="2160" width="1670" height="90" rx="6" fill="#F8FAFC" stroke="#d5dfeb" stroke-width="1"/>
<text x="356" y="2200.2" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Use case theo mục tiêu nghiệp vụ; API CV/profile/assistant còn dựa vào đăng nhập và ownership.</text>
<text x="356" y="2221" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">«include»: hành vi bắt buộc của use case. «extend»: nhánh mở rộng có điều kiện.</text>
</svg>
