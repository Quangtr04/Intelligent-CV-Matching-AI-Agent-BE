<ellipse cx="845" cy="575" rx="345" ry="45" fill="#FFFFFF" stroke="#3d5875" stroke-width="1.7"/>
<text x="845" y="581.3" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#263449">Xác nhận CV và chọn CV chính</text>
<ellipse cx="845" cy="690" rx="345" ry="45" fill="#FFFFFF" stroke="#3d5875" stroke-width="1.7"/>
