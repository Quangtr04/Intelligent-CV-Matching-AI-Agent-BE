<text x="845" y="811.3" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#263449">Tìm việc phù hợp và phản hồi</text>
<ellipse cx="845" cy="920" rx="345" ry="45" fill="#FFFFFF" stroke="#3d5875" stroke-width="1.7"/>
<text x="845" y="926.3" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#263449">Phân tích ATS theo việc làm</text>
