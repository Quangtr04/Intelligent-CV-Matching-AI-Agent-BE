<text x="845" y="1041.3" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#263449">Tạo CV hướng tới việc làm</text>
<ellipse cx="845" cy="1150" rx="345" ry="45" fill="#FFFFFF" stroke="#3d5875" stroke-width="1.7"/>
<text x="845" y="1156.3" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#263449">Soạn / sửa email và cover letter</text>
<ellipse cx="845" cy="1265" rx="345" ry="45" fill="#FFFFFF" stroke="#3d5875" stroke-width="1.7"/>
<text x="845" y="1271.3" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#263449">Ước lượng lương</text>
<ellipse cx="845" cy="1380" rx="345" ry="45" fill="#FFFFFF" stroke="#3d5875" stroke-width="1.7"/>
<text x="845" y="1386.3" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#263449">Tạo và trả lời bài đánh giá kỹ năng</text>
<ellipse cx="845" cy="1495" rx="345" ry="45" fill="#FFFFFF" stroke="#3d5875" stroke-width="1.7"/>
<text x="845" y="1501.3" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#263449">Nộp bài đánh giá kỹ năng</text>
<ellipse cx="845" cy="1610" rx="345" ry="45" fill="#FFFFFF" stroke="#3d5875" stroke-width="1.7"/>
<text x="845" y="1616.3" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#263449">Tạo lộ trình học và cập nhật tiến độ</text>
<ellipse cx="845" cy="1725" rx="345" ry="45" fill="#FFFFFF" stroke="#3d5875" stroke-width="1.7"/>
<text x="845" y="1731.3" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#263449">Trao đổi với trợ lý AI</text>
<ellipse cx="845" cy="1840" rx="345" ry="45" fill="#FFFFFF" stroke="#3d5875" stroke-width="1.7"/>
<text x="845" y="1846.3" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#263449">Yêu cầu / trao đổi tư vấn với consultant</text>
<ellipse cx="845" cy="1955" rx="345" ry="45" fill="#FFFFFF" stroke="#3d5875" stroke-width="1.7"/>
<text x="845" y="1961.3" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#263449">Mở trang ứng tuyển gốc</text>
<ellipse cx="1690" cy="1495" rx="260" ry="45" fill="#F5F3FF" stroke="#3d5875" stroke-width="1.7"/>
<text x="1690" y="1489.6" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#263449">Chấm điểm và tổng hợp</text>
<text x="1690" y="1513" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#263449">kết quả kỹ năng</text>
<ellipse cx="1690" cy="1725" rx="260" ry="45" fill="#EFF6FF" stroke="#3d5875" stroke-width="1.7"/>
<text x="1690" y="1731.3" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#263449">Truy xuất tài liệu RAG</text>
<ellipse cx="135" cy="1061" rx="11" ry="11" fill="#ffffff" stroke="#29465f" stroke-width="1.9"/>
<polyline points="135,1072 135,1103" fill="none" stroke="#29465f" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
