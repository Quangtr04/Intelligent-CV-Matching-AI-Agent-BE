<text x="1466" y="688.9" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Resend: tài khoản tồn tại và còn PENDING.</text>
<rect x="1450" y="1230" width="620" height="140" rx="6" fill="#F8FAFC" stroke="#d5dfeb" stroke-width="1"/>
<text x="1466" y="1284.8" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Trial builder cần AI; recommendations dùng rule.</text>
<text x="1466" y="1305.6" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Tạo đơn chỉ tạo PENDING, chưa checkout.</text>
<text x="1466" y="1326.4" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Webhook là hợp đồng adapter generic.</text>
<rect x="350" y="2050" width="1900" height="80" rx="6" fill="#F8FAFC" stroke="#d5dfeb" stroke-width="1"/>
<text x="366" y="2074.8" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Google dùng email bên thứ ba có thể cần OTP hệ thống. Webhook FAILED/CANCELLED không kích hoạt gói.</text>
<text x="366" y="2095.6" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Đường liên kết actor không có mũi tên; «include» trỏ tới hành vi bắt buộc, «extend» trỏ tới use case được mở rộng.</text>
<text x="366" y="2116.4" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647b">Webhook lặp không tạo lại gói / hóa đơn.</text>
