name: edunexus

services:
  # Opt in to run the backend; AI models stay private on the Compose network.
  app:
    profiles: ['app']
    build:
      context: .
    image: edunexus-backend:local
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_URL: jdbc:postgresql://host.docker.internal:5432/edunexus
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ""
      UPLOAD_DIR: /app/uploads
      AI_PROVIDER: ollama
      AI_CHAT_PROVIDER: ollama
      AI_EMBEDDING_PROVIDER: ollama
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen2.5:7b}
      AI_ASSESSMENT_MODEL: ${AI_ASSESSMENT_MODEL-qwen3.5:4b}
      AI_ASSESSMENT_THINK: ${AI_ASSESSMENT_THINK:-true}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      AI_EMBEDDING_DIMENSIONS: 1024
      OLLAMA_BASE_URL: http://ollama:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:${SERVER_PORT:-8080}'
    volumes:
      - resume_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: ['ai', 'app']
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    expose:
      - '11434'
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: ['ai', 'app']
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen2.5:7b}
      AI_ASSESSMENT_MODEL: ${AI_ASSESSMENT_MODEL-qwen3.5:4b}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        for model in "$${AI_CHAT_MODEL}" "$${AI_EMBEDDING_MODEL}" "$${AI_ASSESSMENT_MODEL}"; do
          [ -n "$${model}" ] || continue
          if ! ollama show "$${model}" >/dev/null 2>&1; then
            ollama pull "$${model}"
          fi
          ollama show "$${model}" >/dev/null
        done
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'


  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    profiles: ['database']
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edunexus}
      POSTGRES_USER: ${POSTGRES_USER:-edunexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # PostgreSQL/pgvector is the current matching store; these optional services
  # retain the original project's infrastructure for future adapters.
  qdrant:
    image: qdrant/qdrant:v1.15.5
    profiles: ['optional']
    ports:
      - '127.0.0.1:6333:6333'
      - '127.0.0.1:6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage

  rabbitmq:
    image: rabbitmq:4.3.6-management
    profiles: ['optional']
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-edunexus}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - '127.0.0.1:5673:5672'
      - '127.0.0.1:15673:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7.4.6-alpine
    profiles: ['optional']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  resume_uploads:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
  redis_data:
  ollama_models:
