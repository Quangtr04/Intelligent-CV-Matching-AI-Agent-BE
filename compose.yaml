name: edunexus

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edunexus}
      POSTGRES_USER: ${POSTGRES_USER:-edunexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # PostgreSQL/pgvector is the current matching store; these optional services
  # retain the original project's infrastructure for future adapters.
  qdrant:
    image: qdrant/qdrant:v1.15.5
    profiles: ['optional']
    ports:
      - '127.0.0.1:6333:6333'
      - '127.0.0.1:6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage

  rabbitmq:
    image: rabbitmq:4.3.6-management
    profiles: ['optional']
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-edunexus}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7.4.6-alpine
    profiles: ['optional']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
  redis_data:
