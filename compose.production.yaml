services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:${SERVER_PORT:?Set SERVER_PORT in .env}"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_PDF_NO_SANDBOX: "true"
      SERVER_PORT: ${SERVER_PORT:?Set SERVER_PORT in .env}
      UPLOAD_DIR: /app/uploads

      # AI - Gemini through OpenAI-compatible API
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: gemini
      AI_CHAT_PROVIDER: openai
      AI_EMBEDDING_PROVIDER: gemini

      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GEMINI_NATIVE_BASE_URL: ${GEMINI_NATIVE_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}

      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-none}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gemini-2.5-flash-lite}
      AI_ASSESSMENT_MODEL: ${AI_ASSESSMENT_MODEL:-gemini-2.5-flash-lite}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-gemini-embedding-001}

      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1024}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2000}
      AI_ASSESSMENT_MAX_OUTPUT_TOKENS: ${AI_ASSESSMENT_MAX_OUTPUT_TOKENS:-12000}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-PT2M}
    env_file:
      - .env
    volumes:
      - resume_uploads:/app/uploads

volumes:
  resume_uploads:
