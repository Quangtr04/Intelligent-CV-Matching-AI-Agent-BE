services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:${SERVER_PORT:?Set SERVER_PORT in .env}"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${SERVER_PORT:?Set SERVER_PORT in .env}
      UPLOAD_DIR: /app/uploads
    env_file:
      - .env
    volumes:
      - resume_uploads:/app/uploads

volumes:
  resume_uploads:
